name: Android APK

on:
  push:
    paths:
      - "android/**"
      - "linux/tether/**"
      - "tests/interop/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - "linux/tether/**"
      - "tests/interop/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Interop test (Kotlin core against the Linux daemon)
        working-directory: .
        run: |
          curl -sSL -o /tmp/kotlinc.zip https://github.com/JetBrains/kotlin/releases/download/v2.0.21/kotlin-compiler-2.0.21.zip
          unzip -q /tmp/kotlinc.zip -d /tmp
          export PATH=/tmp/kotlinc/bin:$PATH
          pip install --quiet aiohttp cryptography
          set -o pipefail
          if ! sh tests/interop/run.sh 2>&1 | tee /tmp/interop.log; then
            # Readable through the API even where the log download isn't.
            echo "::error title=Interop test failed::$(tail -c 6000 /tmp/interop.log | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: tether-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
