name: macOS

on:
  push:
    paths:
      - "macos/**"
      - ".github/workflows/macos.yml"
  pull_request:
    paths:
      - "macos/**"
      - ".github/workflows/macos.yml"
  workflow_dispatch:

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Daemon tests
        run: |
          python -m pip install --quiet "cryptography>=41" "aiohttp>=3.9"
          for t in test_parsers test_app_protocol test_e2e; do
            if ! python "tests/$t.py" > "$RUNNER_TEMP/$t.log" 2>&1; then
              # Also as an annotation, which shows on the run page without opening the log.
              echo "::error title=$t failed::$(tail -40 "$RUNNER_TEMP/$t.log" | python -c 'import sys; print(sys.stdin.read().replace("%","%25").replace("\r","").replace("\n","%0A"))')"
              exit 1
            fi
            tail -20 "$RUNNER_TEMP/$t.log"
          done

      - name: Parse this Mac's network setup
        run: python -c "from tether import wol; import json; print(json.dumps(wol.interfaces(), indent=1))"

      - name: Build the app
        run: |
          if ! app/build.sh "$RUNNER_TEMP/out" > "$RUNNER_TEMP/build.log" 2>&1; then
            grep -E "error:|warning:" "$RUNNER_TEMP/build.log" | sort -u | head -40 | while IFS= read -r line; do
              echo "::error title=swift build::$line"
            done
            tail -30 "$RUNNER_TEMP/build.log"
            exit 1
          fi
          grep -E "warning:" "$RUNNER_TEMP/build.log" | sort -u | head -30 | while IFS= read -r line; do
            echo "::warning title=swift build::$line"
          done || true

      - name: Check the bundle
        run: |
          app="$RUNNER_TEMP/out/Tether.app"
          plutil -lint "$app/Contents/Info.plist"
          codesign --verify --verbose "$app"
          file "$app/Contents/MacOS/Tether"

      - uses: actions/upload-artifact@v4
        with:
          name: Tether-app-${{ github.sha }}
          path: ${{ runner.temp }}/out/Tether.app
          if-no-files-found: error
